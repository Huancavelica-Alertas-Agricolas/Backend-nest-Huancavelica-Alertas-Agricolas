
version: 2.1

# Cleaned and adapted CircleCI configuration.
# - Jobs: install-root, test-services, integration (docker-compose), docker-build-push, deploy-ssh.
# - Workflow has max_auto_reruns enabled.

orbs:
  node: circleci/node@5.0.2

executors:
  node-executor:
    docker:
      - image: cimg/node:18.16

commands:
  install-root-deps:
    description: "Install root-level dependencies if package.json exists"
    steps:
      - run:
          name: Install root deps
          command: |
            if [ -f package.json ]; then npm ci; else echo "no root package.json"; fi

jobs:
  install-root:
    executor: node-executor
    steps:
      - checkout
      - install-root-deps

  test-services:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Run tests for all microservices
          command: |
            set -e
            for svc in microservices/services/*; do
              if [ -f "$svc/package.json" ]; then
                echo "=== Testing $svc ==="
                pushd "$svc"
                npm ci || npm install
                if npm run -s test --silent; then
                  echo "tests OK for $svc"
                else
                  echo "tests failed or none for $svc"
                fi
                popd
              fi
            done
          # retry settings removed from step; managed at workflow level

  integration:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Ensure Docker Compose
          command: |
            docker-compose --version || (curl -L "https://github.com/docker/compose/releases/download/v2.21.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose && chmod +x /usr/local/bin/docker-compose)
      - run:
          name: Start docker-compose
          command: docker-compose -f microservices/docker-compose.yml up -d --build
          # retry settings removed from step; managed at workflow level
      - run:
          name: Wait for postgres
          command: |
            set -e
            echo "Waiting for Postgres containers to be healthy..."
            for i in $(seq 1 60); do
              ok=0
              for c in agro_postgres_users agro_postgres_alerts agro_postgres_logs agro_postgres_preferences; do
                status=$(docker inspect -f '{{.State.Health.Status}}' "$c" 2>/dev/null || echo 'starting')
                echo "$c: $status"
                if [ "$status" = "healthy" ]; then ok=$((ok+1)); fi
              done
              if [ "$ok" -eq 4 ]; then echo "All Postgres containers healthy"; break; fi
              sleep 2
            done
      - run:
          name: Smoke tests
          command: |
            curl -sSf http://localhost:3000/ || true
            curl -sSf http://localhost:3000/alertas || true
      - run:
          name: Teardown
          command: docker-compose -f microservices/docker-compose.yml down --volumes --remove-orphans

  docker-build-push:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: "Debug: list repo root files before docker build"
          command: |
            echo "Listing repo root (for docker build context debug):"
            ls -la . || true
            echo "Check presence of root package.json and microservices folder:"
            ls -la package.json microservices || true
      - run:
          name: Docker login
          command: |
            if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_PASS" ]; then
              echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USER" --password-stdin
              echo "Docker login successful"
              echo "PUSH_ENABLED=1" >> $BASH_ENV
            else
              echo "DockerHub credentials not set. Skipping login and image push."
              echo "PUSH_ENABLED=0" >> $BASH_ENV
            fi
      - run:
          name: Build and push service images
          command: |
            set -e
            BUILD_CONTEXT="microservices"
            for svc in microservices/services/*; do
              if [ -f "$svc/Dockerfile" ]; then
                name=$(basename "$svc")
                # Use microservices/ as build context to match Dockerfiles (COPY .. .)
                docker build -f "$svc/Dockerfile" -t ${DOCKERHUB_USER:-local}/${name}:$CIRCLE_SHA1 "$BUILD_CONTEXT"
                if [ "$PUSH_ENABLED" = "1" ]; then
                  docker push ${DOCKERHUB_USER}/${name}:$CIRCLE_SHA1
                  docker tag ${DOCKERHUB_USER}/${name}:$CIRCLE_SHA1 ${DOCKERHUB_USER}/${name}:latest
                  docker push ${DOCKERHUB_USER}/${name}:latest
                else
                  echo "Push disabled; built image ${DOCKERHUB_USER:-local}/${name}:$CIRCLE_SHA1 locally only"
                fi
              fi
            done
          # retry settings removed from step; managed at workflow level

  deploy-ssh:
    machine:
      image: ubuntu-2404:current
    steps:
      - add_ssh_keys:
          fingerprints:
            - "$DEPLOY_SSH_FP"
      - run:
          name: Deploy via SSH
          command: |
            ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && git pull origin main && docker compose pull && docker compose up -d --build"

workflows:
  ci_on_main:
    max_auto_reruns: 3
    jobs:
      - install-root:
          filters:
            branches:
              only: main
      - test-services:
          requires:
            - install-root
          filters:
            branches:
              only: main
      - integration:
          requires:
            - test-services
          filters:
            branches:
              only: main
      - docker-build-push:
          requires:
            - integration
          filters:
            branches:
              only: main
      - deploy-ssh:
          requires:
            - docker-build-push
          filters:
            branches:
              only: main