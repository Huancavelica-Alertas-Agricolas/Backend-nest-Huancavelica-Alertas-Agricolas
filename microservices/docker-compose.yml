version: '3.8'

services:
  # Postgres per service (one instance per microservice)
  postgres-users:
    image: postgres:15
    container_name: agro_postgres_users
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: users_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    networks:
      - agro-microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d users_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-alerts:
    image: postgres:15
    container_name: agro_postgres_alerts
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: alerts_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_alerts_data:/var/lib/postgresql/data
    networks:
      - agro-microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d alerts_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-logs:
    image: postgres:15
    container_name: agro_postgres_logs
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: logs_db
    ports:
      - "5437:5432"
    volumes:
      - postgres_logs_data:/var/lib/postgresql/data
    networks:
      - agro-microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d logs_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-preferences:
    image: postgres:15
    container_name: agro_postgres_preferences
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: preferences_db
    ports:
      - "5438:5432"
    volumes:
      - postgres_preferences_data:/var/lib/postgresql/data
    networks:
      - agro-microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d preferences_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: ..
      dockerfile: gateway/api-gateway/Dockerfile
    container_name: agro_gateway_microservices
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - USER_SERVICE_HOST=user-service
      - USER_SERVICE_PORT=3001
      - WEATHER_SERVICE_HOST=weather-service
      - WEATHER_SERVICE_PORT=3002
      - NOTIFICATION_SERVICE_HOST=notification-service
      - NOTIFICATION_SERVICE_PORT=3003
      - ALERT_SERVICE_HOST=alert-service
      - ALERT_SERVICE_PORT=3004
      - LOG_SERVICE_HOST=log-service
      - LOG_SERVICE_PORT=3005
      - PREFERENCE_SERVICE_HOST=preference-service
      - PREFERENCE_SERVICE_PORT=3006
    depends_on:
      - user-service
      - weather-service
      - notification-service
      - alert-service
      - log-service
      - preference-service
    networks:
      - agro-microservices-network
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    container_name: agro_user_service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=postgres-users
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_NAME=users_db
    depends_on:
      - postgres-users
    networks:
      - agro-microservices-network
    restart: unless-stopped

  # Weather Service
  weather-service:
    build:
      context: ..
      dockerfile: services/weather-service/Dockerfile
    container_name: agro_weather_service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - API_KEY=${API_KEY}
    volumes:
      - weather_reports:/app/reports
    networks:
      - agro-microservices-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: agro_notification_service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_FROM=${MAIL_FROM}
    networks:
      - agro-microservices-network
    restart: unless-stopped

  # Alert Service (Orchestrator)
  alert-service:
    build:
      context: ..
      dockerfile: services/alert-service/Dockerfile
    container_name: agro_alert_service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - WEATHER_SERVICE_HOST=weather-service
      - WEATHER_SERVICE_PORT=3002
      - NOTIFICATION_SERVICE_HOST=notification-service
      - NOTIFICATION_SERVICE_PORT=3003
      - LOG_SERVICE_HOST=log-service
      - LOG_SERVICE_PORT=3005
      - DB_HOST=postgres-alerts
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_NAME=alerts_db
    depends_on:
      - weather-service
      - notification-service
      - postgres-alerts
    networks:
      - agro-microservices-network
    restart: unless-stopped

  # Log Service
  log-service:
    build:
      context: ..
      dockerfile: services/log-service/Dockerfile
    container_name: agro_log_service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - DB_HOST=postgres-logs
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_NAME=logs_db
    depends_on:
      - postgres-logs
    networks:
      - agro-microservices-network
    restart: unless-stopped

  # Preference Service
  preference-service:
    build:
      context: ..
      dockerfile: services/preference-service/Dockerfile
    container_name: agro_preference_service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=development
      - PORT=3006
      - DB_HOST=postgres-preferences
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_NAME=preferences_db
    depends_on:
      - postgres-preferences
    networks:
      - agro-microservices-network
    restart: unless-stopped

volumes:
  postgres_users_data:
  postgres_alerts_data:
  postgres_logs_data:
  postgres_preferences_data:
  weather_reports:

networks:
  agro-microservices-network:
    driver: bridge