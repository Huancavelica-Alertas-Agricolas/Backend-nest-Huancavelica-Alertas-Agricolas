version: '2.4'
services:
  # ================================
  # BASE DE DATOS
  # ================================
  user_postgres:
    image: postgres:15
    container_name: agro_user_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: user_db
    ports:
      - "5434:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    networks:
      - agro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  alert_postgres:
    image: postgres:15
    container_name: agro_alert_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: alert_db
    ports:
      - "5435:5432"
    volumes:
      - alert_postgres_data:/var/lib/postgresql/data
    networks:
      - agro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d alert_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  log_postgres:
    image: postgres:15
    container_name: agro_log_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: log_db
    ports:
      - "5436:5432"
    volumes:
      - log_postgres_data:/var/lib/postgresql/data
    networks:
      - agro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d log_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  preference_postgres:
    image: postgres:15
    container_name: agro_preference_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: preference_db
    ports:
      - "5437:5432"
    volumes:
      - preference_postgres_data:/var/lib/postgresql/data
    networks:
      - agro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d preference_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  weather_postgres:
    image: postgres:15
    container_name: agro_weather_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: weather_db
    ports:
      - "5438:5432"
    volumes:
      - weather_postgres_data:/var/lib/postgresql/data
    networks:
      - agro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d weather_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification_postgres:
    image: postgres:15
    container_name: agro_notification_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: notification_db
    ports:
      - "5439:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    networks:
      - agro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # MICROSERVICIOS
  # ================================
  
  # API Gateway (Puerto 3000)
  api-gateway:
    build:
      context: ./microservices/gateway/api-gateway
      dockerfile: Dockerfile
    container_name: agro_api_gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - USER_SERVICE_HOST=user-service
      - WEATHER_SERVICE_HOST=weather-service
      - NOTIFICATION_SERVICE_HOST=notification-service
      - ALERT_SERVICE_HOST=alert-service
    depends_on:
      - user-service
      - weather-service
      - notification-service
      - alert-service
    networks:
      - agro-network
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: ./microservices/services/user-service
      dockerfile: Dockerfile
    container_name: agro_user_service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=user_postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_NAME=user_db
    depends_on:
      user_postgres:
        condition: service_healthy
    networks:
      - agro-network
    restart: unless-stopped

  # Weather Service
  weather-service:
    build:
      context: ./microservices/services/weather-service
      dockerfile: Dockerfile
    container_name: agro_weather_service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - DB_HOST=weather_postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_NAME=weather_db
    depends_on:
      weather_postgres:
        condition: service_healthy
    env_file:
      - ./microservices/.env
    networks:
      - agro-network
    volumes:
      - ./microservices/reports:/app/reports
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: ./microservices/services/notification-service
      dockerfile: Dockerfile
    container_name: agro_notification_service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - DB_HOST=notification_postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_NAME=notification_db
    depends_on:
      notification_postgres:
        condition: service_healthy
    env_file:
      - ./microservices/.env
    networks:
      - agro-network
    restart: unless-stopped

  alert-service:
    build:
      context: ./microservices/services/alert-service
      dockerfile: Dockerfile
    container_name: agro_alert_service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - DB_HOST=alert_postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_NAME=alert_db
      - WEATHER_SERVICE_HOST=weather-service
      - NOTIFICATION_SERVICE_HOST=notification-service
    depends_on:
      alert_postgres:
        condition: service_healthy
      weather-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - agro-network
    restart: unless-stopped

volumes:
  user_postgres_data:
  alert_postgres_data:
  log_postgres_data:
  preference_postgres_data:
  weather_postgres_data:
  notification_postgres_data:

networks:
  agro-network:
    driver: bridge